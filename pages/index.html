<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR App - Asistencia</title>
    <script>
        (function () {
            var key = 'clockinapp_theme';
            var saved = localStorage.getItem(key);
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/global_login.css" />
    <link rel="stylesheet" href="../assets/css/index_login.css" />
    <link rel="stylesheet" href="../assets/css/modern_theme.css" />
</head>

    </div>

    window.location.href = 'login/login.html';

</body>

</html>
