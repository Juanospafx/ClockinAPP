<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockinAPP • Login</title>
    <script>
        (function () {
            var key = 'clockinapp_theme';
            var saved = localStorage.getItem(key);
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/global_login.css?v=2.5">
    <link rel="stylesheet" href="../../assets/css/modern_theme.css?v=2.5">
    <link rel="stylesheet" href="../../assets/css/index_login.css?v=2.6">
</head>

<body>
    <button type="button" id="loginThemeToggle" class="login-theme-toggle" onclick="toggleThemeLocal()" title="Switch Day/Night">
        <i class="fas fa-sun"></i>
    </button>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-full" role="img" aria-label="Brightronix Logo"></div>
                <div class="app-subtitle">ClockinAPP</div>
            </div>
            
        <div id="loginMessage" class="text-center"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent" style="border-right:0; border-radius: 12px 0 0 12px; border-color: var(--border-subtle);">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" class="form-control" style="border-left:0; border-radius: 0 12px 12px 0;" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent" style="border-right:0; border-radius: 12px 0 0 12px; border-color: var(--border-subtle);">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" class="form-control" style="border-left:0; border-right:0; border-radius: 0;" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn btn-eye" onclick="togglePasswordVisibility('password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login">
                    Sign In <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
            
            <div class="footer-text">
                Brightronix © 2026. All rights reserved.
            </div>
        </div>
    </div>

    <script src="../../assets/js/script.js?v=2.5"></script>
    
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function toggleThemeLocal() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            
            if (typeof applyTheme === 'function') {
                applyTheme(next); // Usa la lógica global de script.js si está cargada
            } else {
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('clockinapp_theme', next);
            }
            
            const icon = document.querySelector('#loginThemeToggle i');
            if (icon) icon.className = next === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        }
        
        // Update icon correctly on initial load
        document.addEventListener('DOMContentLoaded', () => {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            const icon = document.querySelector('#loginThemeToggle i');
            if (icon) icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        });
    </script>
</body>

</html>
