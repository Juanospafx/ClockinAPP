<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockinAPP • Login</title>
    <link rel="stylesheet" href="../../assets/css/global_login.css?v=2.1">
    <link rel="stylesheet" href="../../assets/css/index_login.css?v=2.1">
    <link rel="stylesheet" href="../../assets/css/modern_theme.css?v=2.1">
</head>

<body>
    <div class="app-shell">
        <div class="login-container">
            <p class="login-brand">ClockinAPP</p>
            <h2>Welcome</h2>
            <p class="login-subtitle">Sign in to continue</p>
            <form id="loginForm">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
                <button type="submit">Access</button>
                <p id="loginMessage" class="error-message"></p>
            </form>
        </div>
    </div>
    <script src="../../assets/js/script.js?v=2.0"></script>
</body>

</html>
