<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar Sesión</title>
    <script>
        (function () {
            var key = 'clockinapp_theme';
            var saved = localStorage.getItem(key);
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/global_login.css">
    <link rel="stylesheet" href="../../assets/css/index_login.css">
    <link rel="stylesheet" href="../../assets/css/modern_theme.css">
</head>
<body>
    <div class="container">
        <h1>Cerrando Sesión...</h1>
        <p>Será redirigido al inicio de sesión.</p>
    </div>
    <script src="../../assets/js/script.js"></script>
    <script>
        // Call logout function from script.js
        document.addEventListener('DOMContentLoaded', () => {
            logout();
        });
    </script>
</body>
</html>
